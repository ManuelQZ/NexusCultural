spring.application.name=nexuscultural

# --- Base de datos H2 (en memoria) por defecto ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiry=60

# --- Firebase ---
firebase.config.path=${FIREBASE_CONFIG_PATH:}

# --- AWS S3 ---
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.s3.credentials-path=${AWS_S3_CREDENTIALS_PATH:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:nexus-cultural-media-2026}

# --- Wompi ---
wompi.public-key=${WOMPI_PUBLIC_KEY}
wompi.private-key=${WOMPI_PRIVATE_KEY}
wompi.events-secret=${WOMPI_EVENTS_SECRET}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET}
wompi.checkout-url=${WOMPI_CHECKOUT_URL}
wompi.api-url=${WOMPI_API_URL}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
